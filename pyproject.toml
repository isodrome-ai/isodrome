[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "isodrome"
dynamic = ["version"]
description = "Python SDK and CLI for Isodrome: deterministic real-time feature infrastructure for trading."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Isodrome", email = "james@isodrome.ai" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "click>=8.1",
  # The generated client in src/isodrome/v1 requires at least the versions it was generated with.
  "grpcio>=1.84.0",
  "protobuf>=7.36.0",
  "pyarrow>=14",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  # Pinned: scripts/sync_proto.sh --check compares the committed code with what this version generates.
  "grpcio-tools==1.84.0",
  "pytest>=8",
]

[project.urls]
Homepage = "https://isodrome.ai"

[project.scripts]
iso = "isodrome.cli:main"
isodrome = "isodrome.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/isodrome/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs against a real server (set ISODROME_E2E_ENDPOINT)"]
