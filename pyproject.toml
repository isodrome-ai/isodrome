[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "isodrome"
dynamic = ["version"]
description = "Python SDK for Isodrome: deterministic real-time feature infrastructure for trading."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Isodrome", email = "james@isodrome.ai" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://isodrome.ai"

[project.scripts]
iso = "isodrome.cli:main"
isodrome = "isodrome.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/isodrome/_version.py"
